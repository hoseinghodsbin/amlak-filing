name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "AmlakFiling" --clean amlak_filing.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmlakFiling-Windows
        path: dist/AmlakFiling.exe
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: نسخه ۱.۰.۰ - نرم‌افزار فایلینگ املاک
        body: |
          ## نرم‌افزار فایلینگ املاک
          
          فایل اجرایی ویندوز آماده است.
          
          فقط فایل `AmlakFiling.exe` را دانلود و اجرا کنید.
          دیتابیس به صورت خودکار ساخته می‌شود.
        files: dist/AmlakFiling.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
